<body>

<div id="modal"></div>
<div id="dlg"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- utilità ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = (s) => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = parseD(s); d.setMonth(d.getMonth() + n); return iso(d); };
const diff = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const monday = (s) => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const fmtD = (s) => (s ? String(s).split('-').reverse().join('/') : '');
const MESI3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
/* "lunedì 12 ottobre", usata come sottotitolo della Home al posto della vecchia descrizione */
const dataLunga = (iso) => { const d = parseD(iso); return GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()].toLowerCase(); };
const fmtShort = (s) => { if (!s) return ''; const d = parseD(s); return d.getDate() + ' ' + MESI3[d.getMonth()]; };
const eur = (n) => '€\u00a0' + Math.round(Number(n) || 0).toLocaleString('it-IT');
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const isoWeek = (s) => { const d = parseD(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); };
const sum = (a, f) => a.reduce((t, x) => t + (Number(f ? f(x) : x) || 0), 0);
const byStr = (f) => (a, b) => String(f(a) || '').localeCompare(String(f(b) || ''), 'it');

/* ---------- stato ---------- */
const COLS = ['clienti', 'commesse', 'dipendenti', 'squadre', 'assegnazioni', 'assegnazioniG', 'tipiLavoro', 'categorie', 'docAzienda', 'assicurazioni', 'mezzi', 'documenti', 'verbali', 'scadenze', 'riservato', 'accessi', 'impostazioni', 'commesseElenco', 'registri', 'fatture'];
const S = { route: 'dashboard', id: null, tab: null, q: '', hq: '', fstato: '', week: null, calY: null, calM: null, ftipo: '', dcat: '', ptab: 'dipendenti', atab: 'documenti', data: {}, loaded: {}, admin: false, me: '', uid: null, late: false, offline: false, syncTrouble: false, mese: null, otab: 'riepilogo', opers: null, myOre: { mese: null, righe: [], loaded: false }, oreAll: {}, oreLoading: false, prof: {} };
const D = (c) => Object.values(S.data[c] || {});
const G = (c, id) => (S.data[c] || {})[id];
let db = null, assets = null, user = null, dl = null;

const errMsg = (e) => (e && e.vmsg ? e.vmsg : e && e.code === 'quota_exceeded' ? 'Limite di documenti raggiunto.' : e && e.code === 'invalid_argument' ? 'Non hai i permessi per modificare questi dati.' : 'Salvataggio non riuscito, riprova.');
const chain = {};
function serial(path, fn) { const p = (chain[path] || Promise.resolve()).catch(() => {}).then(fn); chain[path] = p; return p; }
async function put(col, id, obj) { const o = clone(obj); delete o.id; try { await serial(col + '/' + id, () => db.doc(col + '/' + id).set(o)); } catch (e) { toast(errMsg(e), 'err'); throw e; } }
async function patch(col, id, part) { try { await serial(col + '/' + id, () => db.doc(col + '/' + id).update(clone(part))); } catch (e) { toast(errMsg(e), 'err'); throw e; } }
async function remove(col, id) { try { await serial(col + '/' + id, () => db.doc(col + '/' + id).delete()); } catch (e) { toast(errMsg(e), 'err'); throw e; } }
const newId = (col) => db.collection(col).doc().id;
async function uploadFile(file, folderPath) { if (!assets) throw new Error('assets'); const r = await assets.upload(file, folderPath); return { id: r.id, name: file.name, url: r.url || '' }; }
/* sposta (non elimina) la copia su Drive di un allegato caricato dall'app in una sottocartella
   "Scaduti" della stessa cartella in cui si trovava: usata quando un campo "file" viene
   sostituito con un nuovo caricamento, un altro link, o rimosso, cosi' la vecchia copia non
   resta per sempre mescolata con quella attuale né viene cancellata, ma finisce in un archivio
   facile da trovare (es. Personale/Mario Rossi/Documenti personali/Scaduti).
   Va in background, senza bloccare il salvataggio: se fallisce (permessi, file già sparito…)
   non succede nulla di grave, resta solo un file da spostare a mano in futuro. */
async function archiveDriveFile(id, folderPath) {
  if (!id) return;
  try {
    /* solo il token già in cache, MAI una richiesta interattiva: questo spostamento parte da
       solo in sottofondo dopo il salvataggio di un modulo, non da un click diretto dell'utente
       — se si chiedesse qui un nuovo consenso a Google, capiterebbe di vedersi comparire la
       schermata di autorizzazione senza un motivo visibile legato a quello che si sta facendo.
       Se non c'è un token pronto si passa dritti al metodo di riserva via Apps Script. */
    const token = driveTokenMem || loadSavedDriveToken();
    if (token) {
      const destId = await driveEnsureFolderPath(token, (folderPath || []).concat('Scaduti'));
      const info = await driveFetch(token, 'https://www.googleapis.com/drive/v3/files/' + id + '?fields=parents');
      const cur = await info.json();
      const vecchi = (cur.parents || []).filter((p) => p !== destId).join(',');
      await driveFetch(token, 'https://www.googleapis.com/drive/v3/files/' + id + '?addParents=' + encodeURIComponent(destId) + (vecchi ? '&removeParents=' + encodeURIComponent(vecchi) : '') + '&fields=id,parents', { method: 'PATCH' });
      return;
    }
  } catch (e) { /* si tenta il metodo di riserva */ }
  try { await api('archiveFile', { fileId: id, folderPath: folderPath || [] }); } catch (e2) { /* pulizia non essenziale */ }
}

let rq = 0;
function queueRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
/* se una pagina fallisce a disegnarsi (es. per un caso limite nei dati arrivati da un
   aggiornamento in background, magari da un altro dispositivo collegato con lo stesso
   account) non deve lasciare l'utente su una pagina bianca senza via d'uscita: meglio un
   messaggio recuperabile, con la possibilità di tornare alla Dashboard o ricaricare. */
function render() {
  const app = $('#app'); if (!app) return;
  const ae = document.activeElement;
  const fid = ae && ae.id && app.contains(ae) ? ae.id : null;
  const sel = ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;

  catch (e) {
    console.error('Errore di visualizzazione', e);
    app.innerHTML = '<div class="center card"><h1 style="font-size:24px">Si è verificato un problema nel mostrare questa pagina</h1><p class="muted">Può capitare dopo un aggiornamento dei dati. Riprova, o ricarica la pagina se il problema resta.</p><div class="row" style="margin-top:12px;justify-content:center"><button class="btn" onclick="go(\'dashboard\')">Torna alla Dashboard</button><button class="btn p" onclick="location.reload()">Ricarica la pagina</button></div></div>';
    return;

  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }

let scrollLocks = 0, savedScrollY = 0;

function unlockScroll() { if (scrollLocks === 0) return; scrollLocks--; if (scrollLocks === 0) { document.documentElement.classList.remove('modal-open'); document.body.classList.remove('modal-open'); document.body.style.top = ''; window.scrollTo(0, savedScrollY); } }

    return '<div class="' + cl + '">' + lb + '<div class="row"><input type="file" id="' + id + '" name="' + f.k + '" style="flex:1" onchange="localFilePicked(this)"><button type="button" class="btn sm" onclick="driveBrowseClick(this)" data-target="' + id + '_url">Sfoglia Drive</button></div>' + cur + (!assets ? '<div class="hint">Il caricamento dei file non è disponibile in questa vista.</div>' : '') + '<label for="' + id + '_url" style="margin-top:8px">Oppure link a Google Drive</label><input type="text" inputmode="url" id="' + id + '_url" placeholder="https://drive.google.com/…" value="' + esc(v && v.url ? v.url : '') + '">' + ht + '</div>';

function openForm(cfg) {

  openModal('<form id="mform" novalidate><h2 class="mt">' + esc(cfg.title) + '</h2>' + (cfg.info ? '<p class="hint" style="margin:6px 0 0">' + esc(cfg.info) + '</p>' : '') + '<div class="fgrid" style="margin-top:12px">' + body + '</div><div class="err" id="ferr" role="alert"></div><div class="row sp" style="margin-top:14px"><span>' + (cfg.onDelete ? '<button type="button" class="btn d" data-a="formDel">Elimina</button>' : '') + '</span><span class="row"><button type="button" class="btn" data-a="formCancel">Annulla</button><button type="submit" class="btn p">' + esc(cfg.submit || 'Salva') + '</button></span></div></form>', cfg.wide);

async function submitForm() {
  const cfg = FORM; if (!cfg) return;
  const out = {}, err = $('#ferr'); err.textContent = '';
  const btn = $('#mform button[type=submit]'), btnLabel = (cfg.submit || 'Salva');
  const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = btnLabel; } };
  /* percorso di cartelle su Drive per i file di questo modulo: un array fisso (es. ['Commesse',
     'ABC123 · Mario Rossi', 'Sicurezza']) oppure una funzione dei valori già raccolti, per i
     moduli dove la cartella dipende da una scelta fatta nel modulo stesso (es. la categoria nel
     Documentale). Senza cfg.folder i file finiscono nella cartella radice, come prima. */
  const folderPath = () => { try { return (typeof cfg.folder === 'function' ? cfg.folder(out) : cfg.folder) || []; } catch (e) { return []; } };
  for (const f of cfg.fields) {
    const t = f.t || 'text', el = document.getElementById('f_' + f.k);
    let v;
    if (t === 'checkbox') v = !!(el && el.checked);
    else if (t === 'multi') {
      /* una voce già salvata ma non più tra le opzioni mostrate (es. cancellata da Impostazioni
         → Elenchi, o esclusa a priori come "Altro") non ha una casella da spuntare: ricostruire
         il valore SOLO dalle caselle spuntate la perdeva per sempre al primo salvataggio
         successivo, anche solo per cambiare un altro campo del modulo. Le voci così "orfane"
         restano quindi, invariate, oltre a quelle effettivamente spuntate. */
      const precedenti = (cfg.values && Array.isArray(cfg.values[f.k])) ? cfg.values[f.k] : [];
      const mostrate = (f.opts || []).map((o) => String(o[0]));
      const orfane = precedenti.filter((x) => !mostrate.includes(String(x)));
      v = [...document.querySelectorAll('#mform .multi[data-k="' + f.k + '"] input:checked')].map((x) => x.value).concat(orfane);
    }
    else if (t === 'file') {
      const oldVal = (cfg.values && cfg.values[f.k]) || null;
      v = oldVal;
      const file = el && el.files && el.files[0], ue = document.getElementById('f_' + f.k + '_url'), lk = ue ? ue.value.trim() : '';
      if (!file && lk) { const su = safeUrl(lk); if (!su) { err.textContent = 'Il link deve iniziare con https://'; if (ue) ue.focus(); return; } v = { url: su, name: (ue && ue.dataset.pickedName) || 'Apri su Drive' }; }
      else if (!file && !lk && v && v.url) v = null;
      if (file) {
        try { btn.disabled = true; btn.textContent = 'Caricamento file in corso…'; v = await uploadFile(file, folderPath()); }
        catch (e) { err.textContent = 'Caricamento del file non riuscito.'; resetBtn(); return; }
      }
      /* se la copia precedente era stata caricata da noi (ha un id, a differenza di un link
         scelto con "Sfoglia Drive") e non è più quella attuale, la vecchia copia su Drive viene
         spostata nella sottocartella "Scaduti" (invece di restare mescolata con quella nuova,
         o di essere cancellata) */
      if (oldVal && oldVal.id && (!v || v.url !== oldVal.url)) archiveDriveFile(oldVal.id, folderPath());
    } else if (t === 'filemulti') {
      const files = el && el.files ? Array.from(el.files) : [], pe = document.getElementById('f_' + f.k + '_picked');
      let picked = []; try { picked = pe && pe.value ? JSON.parse(pe.value) : []; } catch (e2) { picked = []; }
      if (picked.length) v = picked;
      else if (files.length) {
        v = [];
        try {
          btn.disabled = true;
          /* una alla volta, non tutte insieme: con molte foto un invio simultaneo sovraccarica il
             backend (lo stesso motivo per cui "Registro ore" ora carica a piccoli gruppi) */
          const fp = folderPath();
          for (let k = 0; k < files.length; k++) { btn.textContent = 'Caricamento foto ' + (k + 1) + '/' + files.length + '…'; v.push(await uploadFile(files[k], fp)); }
        } catch (e3) { err.textContent = 'Caricamento dei file non riuscito.'; resetBtn(); return; }
      } else v = [];
    } else { v = el ? el.value.trim() : ''; if (t === 'number') v = v === '' ? '' : num(v); }
    if (f.req && (v === '' || v == null || (Array.isArray(v) && !v.length))) { err.textContent = 'Compila il campo: ' + f.l; if (el && el.focus) el.focus(); return; }
    out[f.k] = v;
  }
  try { btn.disabled = true; btn.textContent = 'Salvataggio…'; await cfg.onSave(out); closeModal(); } catch (e) { err.textContent = errMsg(e); resetBtn(); }
}

/* modifica di un elemento dentro un array del documento (sicurezza, pagamenti, abilitazioni...) */
function editSub(o) {
  const doc = G(o.col, o.id); if (!doc) return;
  const arr = clone(doc[o.key] || []);
  const isNew = o.i == null || o.i === '';
  const cur = isNew ? (o.defaults || {}) : arr[+o.i];
  /* l'array da modificare si rilegge da capo al salvataggio, non da questa copia presa
     quando si è aperto il modulo: usata da moltissime funzioni (pagamenti, costi,
     abilitazioni, documenti personale, controlli mezzi…), senza questo bastava lasciare il
     modulo aperto un momento — o due salvataggi ravvicinati sullo stesso elenco — perché una
     modifica nel frattempo venisse sovrascritta e persa (stesso bug corretto per le checklist
     dell'iter e di cantiere). */
  openForm({
    title: o.title, fields: o.fields, values: cur, info: o.info, wide: o.wide, folder: o.folder,
    onSave: async (v) => {
      const doc2 = clone(G(o.col, o.id)), arr2 = doc2[o.key] || [];
      let item = Object.assign({}, cur, v);
      if (o.map) item = o.map(item);
      if (isNew) { item.id = uid(); arr2.push(item); } else arr2[+o.i] = item;
      doc2[o.key] = arr2;
      applyLocalWrite(o.col, o.id, doc2);
      await patch(o.col, o.id, { [o.key]: arr2 });
      if (o.after) setTimeout(o.after, 0);
    },
    onDelete: isNew ? null : async () => {
      const doc2 = clone(G(o.col, o.id)), arr2 = doc2[o.key] || [];
      arr2.splice(+o.i, 1);
      doc2[o.key] = arr2;
      applyLocalWrite(o.col, o.id, doc2);
      await patch(o.col, o.id, { [o.key]: arr2 });
      if (o.after) setTimeout(o.after, 0);
    }
  });
}

/* le quattro checklist di sicurezza non fanno parte dell'iter ordinario di una nuova commessa:
   restano sempre disponibili come passaggi a sé, da aggiungere a mano con "+ Aggiungi
   passaggio" nella scheda Iter di ogni commessa, scegliendo lì per quale ruolo (una, più di
   una, o nessuna: dipende da come lavori in quella specifica commessa). */
const SIC_TUTTE = [SIC_ESECUTRICE, SIC_AFFIDATARIA, SIC_SUBAPPALTATRICE, SIC_DL];
function newIter() { return DEFAULT_ITER.map((s) => ({ codice: s.codice, nome: s.nome, stato: 'DA_FARE', bloccante: !!s.bloccante, responsabile: '', dataPrevista: '', note: '', voci: s.voci.map((t) => ({ t, done: false })) })); }
/* tutti i passaggi che si possono aggiungere a una commessa con "+ Aggiungi passaggio":
   quelli del modello base che non ha ancora, più le quattro checklist di sicurezza, inserite
   nella stessa posizione (prima di "Cantiere") che avrebbero se facessero parte del modello,
   così un passaggio aggiunto finisce nel posto giusto invece che sempre in fondo. */
function iterDisponibili() {
  const base = DEFAULT_ITER.slice(), ins = base.findIndex((s) => s.codice === 'CANTIERE');
  base.splice(ins < 0 ? base.length : ins, 0, ...SIC_TUTTE);
  return base;
}

const stepOk = (s) => !!s && (s.stato === 'COMPLETATO' || s.stato === 'NON_APPLICABILE');

function iterCount(c) { const st = (c.iter || []).filter((s) => s.stato !== 'NON_APPLICABILE'); return [st.filter((s) => s.stato === 'COMPLETATO').length, st.length]; }
function pctFasi(c) {
  const f = c.fasi || []; const tot = sum(f, (x) => x.peso || 1); if (!tot) return 0;
  return Math.round(100 * sum(f, (x) => (x.peso || 1) * ((x.voci || []).length ? (x.voci || []).filter((v) => v.done).length / x.voci.length : 0)) / tot);

const squadraDi = (dipId) => D('squadre').filter((s) => (s.membri || []).includes(dipId)).map((s) => s.nome).join(', ');

/* controlli prima di assegnare una squadra a una commessa in una settimana */
function verifica(c, sq, week) {
  const bl = [], av = [], end = addDays(week, 6);
  if (!stepOk(stepOf(c, 'CONFERMA_ORDINE'))) bl.push('La conferma d\u2019ordine non è completata.');
  if (!docAzOk('DURC', week)) bl.push('Il DURC aziendale manca o è scaduto.');
  const tipi = (c.tipiLavoro || []).map((id) => G('tipiLavoro', id)).filter(Boolean);
  const abReq = new Set(), docReq = new Set();
  tipi.forEach((t) => { (t.abilitazioniRichieste || []).forEach((x) => abReq.add(x)); (t.docImpresaRichiesti || []).forEach((x) => docReq.add(x)); });
  docReq.forEach((k) => { if (!docAzOk(k, week)) bl.push('Manca un documento aziendale valido: ' + lab(TIPI_DOC_AZ, k) + '.'); });
  const membri = (sq.membri || []).map((id) => G('dipendenti', id)).filter(Boolean);
  if (!membri.length) av.push('La squadra non ha dipendenti assegnati.');
  abReq.forEach((k) => {
    const manca = [], scade = [];
    membri.forEach((d) => {
      const a = (d.abilitazioni || []).filter((x) => x.tipo === k);
      if (!a.some((x) => !x.dataScadenza || x.dataScadenza >= week)) manca.push(d.cognome);
      else if (!a.some((x) => !x.dataScadenza || x.dataScadenza >= end)) scade.push(d.cognome);
    });
    if (manca.length) bl.push(abLabel(k) + ' mancante o scaduta: ' + manca.join(', ') + '.');
    if (scade.length) av.push(abLabel(k) + ' scade durante la settimana: ' + scade.join(', ') + '.');
  });
  return { bl, av };
}
/* controlli sui passaggi dell'iter */
function bloccoStep(c, s, nuovo) {
  if (nuovo === 'DA_FARE' || nuovo === 'NON_APPLICABILE') return '';
  if (s.codice === 'FATTURA_SALDO' && !stepOk(stepOf(c, 'DICO'))) return 'Serve la DICO completata prima della fattura di saldo.';
  if (s.codice === 'CANTIERE' && !stepOk(stepOf(c, 'CONFERMA_ORDINE'))) return 'Il cantiere non può partire senza conferma d\u2019ordine.';
  return '';
}

/* ---------- scadenzario ---------- */
function eventi() {
  const ev = [];
  const push = (data, tipo, titolo, sub, ref) => { if (data) ev.push({ data, tipo, titolo, sub: sub || '', ref: ref || null }); };
  D('dipendenti').forEach((d) => {
    (d.abilitazioni || []).filter((a) => !a.archiviato).forEach((a) => push(a.dataScadenza, 'FORMAZIONE', abLabel(a.tipo), nomeD(d), { r: 'dipendente', id: d.id }));
    (d.documenti || []).forEach((x) => push(x.scadenza, 'PERSONALE', x.titolo || lab(TIPI_DOC_DIP, x.tipo), nomeD(d), { r: 'dipendente', id: d.id }));
  });
  D('docAzienda').filter((x) => !x.archiviato).forEach((x) => push(x.dataScadenza, 'AZIENDA', x.titolo || lab(TIPI_DOC_AZ, x.tipo), x.ente || '', { r: 'azienda', tab: 'documenti' }));
  D('assicurazioni').filter((x) => !x.archiviato).forEach((x) => push(x.dataScadenza, 'ASSICURAZIONE', lab(TIPI_ASS, x.tipo), x.compagnia || '', { r: 'azienda', tab: 'assicurazioni' }));
  D('fatture').filter((f) => !fatSaldata(f) && f.scadenza).forEach((f) => push(f.scadenza, 'FATTURA', (f.dir === 'P' ? 'Da pagare: ' : 'Da incassare: ') + (f.controparte || '') + ' · ' + eur2(residuoFat(f)), 'Fattura ' + (f.numero || ''), { r: 'fatture', tab: f.dir }));
  D('mezzi').filter((m) => m.attivo !== false).forEach((m) => {
    /* revisione e bollo arrivano già da qui sotto (sono due dei tipi di controllo), presi
       dall'ultimo controllo di quel tipo caricato: niente più campo scadenza separato da tenere
       aggiornato a mano sulla scheda del mezzo. */
    const ult = {};
    (m.controlli || []).forEach((c) => { if (!ult[c.tipo] || c.data > ult[c.tipo].data) ult[c.tipo] = c; });
    Object.values(ult).forEach((c) => push(c.prossimaScadenza, 'MEZZO', lab(TIPI_CONTROLLO, c.tipo) + ' ' + m.descrizione, m.targa || '', { r: 'mezzo', id: m.id }));
    const um = {};
    (m.manutenzioni || []).forEach((c) => { if (!um[c.tipo] || c.data > um[c.tipo].data) um[c.tipo] = c; });
    Object.values(um).forEach((c) => push(c.prossimaScadenza, 'MEZZO', lab(TIPI_MAN, c.tipo) + ' ' + m.descrizione, m.targa || '', { r: 'mezzo', id: m.id }));
    (m.multe || []).forEach((c) => { if ((c.stato || 'DA_PAGARE') === 'DA_PAGARE') push(c.scadenzaPagamento, 'MEZZO', 'Multa da pagare ' + m.descrizione, m.targa || '', { r: 'mezzo', id: m.id }); });
  });
  D('commesse').forEach((c) => {
    if (!ATTIVE.includes(c.stato)) return;
    (c.sicurezza || []).forEach((s) => push(s.dataScadenza, 'SICUREZZA', lab(TIPI_SIC, s.tipo) + ' ' + c.codice, c.titolo, { r: 'commessa', id: c.id, tab: 'sicurezza' }));
    (c.pagamenti || []).forEach((p) => { const res = (Number(p.importo) || 0) - incassatoP(p); if (res > 0.5) push(p.dataScadenza, 'INCASSO', 'Incasso ' + (p.descrizione || lab(TIPI_PAG, p.tipo)) + ' · ' + eur(res), c.codice + ' · ' + clienteNome(c.clienteId), { r: 'commessa', id: c.id, tab: 'economia' }); });
    (c.documentiAmm || []).forEach((x) => push(x.scadenza, 'COMMESSA', (x.titolo || lab(TIPI_DOC_COMM, x.tipo)) + ' ' + c.codice, c.titolo, { r: 'commessa', id: c.id, tab: 'economia' }));
  });
  D('verbali').concat(D('riservato').filter((x) => x.kind === 'verbale')).forEach((v) => (v.azioni || []).forEach((a) => { if (a.stato !== 'CHIUSA') push(a.scadenza, 'ALTRO', a.descrizione, 'Azione da verbale · ' + (a.responsabile || ''), { r: 'documentale' }); }));

    if (x.stato === 'CHIUSA') return;

  });

}

/* aggiorna subito i dati in locale, prima ancora che il salvataggio sia confermato dal
   backend: senza questo, spuntare due voci della stessa checklist in rapida successione (il
   backend può metterci diversi secondi a rispondere) fa sì che il secondo salvataggio parta
   da una copia dei dati presa PRIMA che il primo fosse arrivato al server — quando arriva,
   sovrascrive l'intero iter e la prima spunta sparisce, come se "non fosse rimasta flaggata". */
C.iterStato = async (d, v) => {
  const c = clone(G('commesse', d.id)), s = c.iter[+d.i], msg = bloccoStep(c, s, v);
  if (msg) { toast(msg, 'err'); queueRender(); return; }
  s.stato = v; if (v === 'COMPLETATO') s.voci.forEach((x) => { x.done = true; });
  /* quando la Conferma d'ordine viene segnata Fatta, la commessa è a tutti gli effetti vinta:
     se lo Stato è ancora "Offerta" (il valore proposto alla creazione) lo si porta da solo ad
     "Acquisita", altrimenti restava un campo separato facile da dimenticare — e una commessa
     ancora in Offerta non compare nel Planning né nelle altre liste delle commesse attive.
     Lo Stato finisce nel salvataggio solo quando viene DAVVERO cambiato qui: mandarlo indietro
     sempre (anche quando resta uguale) rischiava di sovrascrivere, con un valore ormai vecchio
     letto dalla cache locale, un cambiamento di Stato fatto nel frattempo da un'altra scheda o
     dispositivo (es. da "Modifica commessa"). */
  const parte = { iter: c.iter };
  if (s.codice === 'CONFERMA_ORDINE' && v === 'COMPLETATO' && c.stato === 'OFFERTA') { c.stato = 'ACQUISITA'; parte.stato = c.stato; toast('Stato della commessa aggiornato automaticamente ad Acquisita.'); }
  applyLocalWrite('commesse', c.id, c);
  await patch('commesse', c.id, parte);
};
C.iterVoce = async (d, v, el) => {
  const c = clone(G('commesse', d.id)), s = c.iter[+d.i], x = s.voci[+d.j];
  const stato = el.checked && s.stato === 'DA_FARE' ? 'IN_CORSO' : s.stato;
  const msg = el.checked ? bloccoStep(c, s, stato) : '';
  if (msg) { toast(msg, 'err'); queueRender(); return; }
  x.done = el.checked;
  const all = s.voci.length && s.voci.every((y) => y.done), any = s.voci.some((y) => y.done);
  if (all && s.stato !== 'NON_APPLICABILE') s.stato = 'COMPLETATO'; else if (!all && s.stato === 'COMPLETATO') s.stato = 'IN_CORSO'; else if (any && s.stato === 'DA_FARE') s.stato = 'IN_CORSO';
  /* stesso automatismo di C.iterStato (e stessa cautela: lo Stato finisce nel salvataggio solo
     se viene davvero cambiato qui, vedi commento in C.iterStato): qui il passaggio si completa
     spuntando l'ultima voce della checklist, non cambiando il menu a tendina — è il modo più
     comune, va coperto anche qui perché la commessa non resti bloccata in Offerta senza che

  const parte = { iter: c.iter };

/* aggiunge a una commessa già esistente un passaggio del modello che non aveva ancora (es. un

   posizione che ha nel modello rispetto ai passaggi già presenti, non sempre in fondo */
A.iterPassAdd = (d) => {
  const c = G('commesse', d.id), disp = iterDisponibili(), mancano = disp.filter((s) => !(c.iter || []).some((x) => x.codice === s.codice));
  if (!mancano.length) return;

      const c2 = clone(G('commesse', d.id)), n = c2.iter || [], posModello = disp.findIndex((x) => x.codice === s.codice);

let clienteFields = () => [{ k: 'ragioneSociale', l: 'Ragione sociale', req: true }, { k: 'stato', l: 'Stato cliente', t: 'select', req: true, opts: TIPI_CLI_STATO.map((x) => [x[0], x[1]]), hint: 'Potenziale: puoi caricare offerte e preventivi. Acquisito: puoi creare e gestire le commesse.' }, { k: 'piva', l: 'Partita IVA', half: true }, { k: 'referente', l: 'Referente', half: true }, { k: 'indirizzo', l: 'Indirizzo' }, { k: 'citta', l: 'Città', half: true }, { k: 'provincia', l: 'Provincia', half: true }, { k: 'telefono', l: 'Telefono', half: true }, { k: 'email', l: 'Email', half: true }, { k: 'pec', l: 'PEC' }, { k: 'note', l: 'Note', t: 'textarea' }];
function vClienti() {
  const q = S.q.toLowerCase(), f = S.cfil || 'tutti';
  const tutti = D('clienti'), nA = tutti.filter((c) => statoCli(c) === 'ACQUISITO').length, nP = tutti.length - nA;
  const cs = tutti.filter((c) => (f === 'tutti' || statoCli(c) === f) && (!q || (c.ragioneSociale + ' ' + (c.citta || '') + ' ' + (c.piva || '')).toLowerCase().includes(q))).sort(byStr((x) => x.ragioneSociale));
  const tabs = '<div class="tabs" role="tablist">' + [['tutti', 'Tutti (' + tutti.length + ')'], ['ACQUISITO', 'Acquisiti (' + nA + ')'], ['POTENZIALE', 'Potenziali (' + nP + ')']].map((t) => '<button class="tab' + (f === t[0] ? ' on' : '') + '" data-a="cfil" data-t="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';
  const t = tbl([{ h: 'Cliente', f: (c) => '<b>' + esc(c.ragioneSociale) + '</b>' }, { h: 'Stato', f: (c) => stBadge(TIPI_CLI_STATO, statoCli(c)) }, { h: 'Città', f: (c) => esc(c.citta) }, { h: 'Referente', f: (c) => esc(c.referente) + '<div class="small muted">' + esc([c.telefono, c.email].filter(Boolean).join(' · ')) + '</div>' }, { h: 'Commesse', r: true, f: (c) => D('commesse').filter((x) => x.clienteId === c.id).length || '—' }, { h: 'Offerte', r: true, f: (c) => (c.offerte || []).length || '—' }], cs, { empty: 'Nessun cliente in questo elenco.', row: (c) => 'data-a="goRef" data-r="cliente" data-id="' + esc(c.id) + '"' });
  return pageHead('Clienti', 'Clienti potenziali (offerte e preventivi) e acquisiti (commesse).', '<button class="btn p" data-a="cliNew">Nuovo cliente</button>') + tabs + '<div class="fbar"><input id="q" data-in="q" placeholder="Cerca cliente" aria-label="Cerca" value="' + esc(S.q) + '"></div><div class="card">' + t + '</div>';
}
A.cfil = (d) => { S.cfil = d.t; queueRender(); };
const offFields = () => [{ k: 'titolo', l: 'Oggetto dell’offerta', req: true }, { k: 'data', l: 'Data', t: 'date', half: true }, { k: 'importo', l: 'Importo (€)', t: 'number', half: true }, { k: 'esito', l: 'Esito', t: 'select', half: true, opts: ESITI_OFF }, { k: 'file', l: 'Offerta / preventivo (file)', t: 'file' }, { k: 'note', l: 'Note', t: 'textarea' }];
function offForm(cid, oid) {
  const c = G('clienti', cid); if (!c) return;
  const cur = oid ? (c.offerte || []).find((x) => x.id === oid) : { data: today(), esito: 'INVIATA' }; if (!cur) return;
  const salva = async (arr) => { const doc2 = clone(G('clienti', cid)); doc2.offerte = arr; applyLocalWrite('clienti', cid, doc2); await patch('clienti', cid, { offerte: arr }); };
  openForm({
    title: 'Offerta o preventivo', fields: offFields(), values: cur, folder: ['Clienti', c.ragioneSociale, 'Offerte e preventivi'],
    onSave: async (v) => {
      const arr = clone(G('clienti', cid).offerte || []); let item = Object.assign({}, cur, v);
      if (oid) { const i = arr.findIndex((x) => x.id === oid); arr[i] = item; } else { item.id = uid(); arr.push(item); }
      await salva(arr);
      if (item.esito === 'ACCETTATA' && !item.commessaId) setTimeout(() => offAccettata(cid, item.id), 300);
    },
    onDelete: oid ? async () => { await salva(clone(G('clienti', cid).offerte || []).filter((x) => x.id !== oid)); } : null
  });
}
async function offAccettata(cid, oid) {
  const c = G('clienti', cid), o = c && (c.offerte || []).find((x) => x.id === oid); if (!o) return;
  if (!(await confirmBox('Offerta accettata. Segno “' + c.ragioneSociale + '” come cliente acquisito e creo la commessa con i dati dell’offerta?', 'Crea commessa'))) return;
  if (statoCli(c) !== 'ACQUISITO') { const d2 = clone(c); d2.stato = 'ACQUISITO'; applyLocalWrite('clienti', cid, d2); await patch('clienti', cid, { stato: 'ACQUISITO' }); }
  nuovaCommessa({ clienteId: cid, titolo: o.titolo, importo: o.importo, stato: 'ACQUISITA', _docs: o.file ? [{ id: uid(), tipo: 'OFFERTA_ACCETTATA', titolo: o.titolo, data: o.data || today(), file: o.file }] : undefined }, async (id) => {
    const arr = clone(G('clienti', cid).offerte || []).map((x) => (x.id === oid ? Object.assign({}, x, { commessaId: id }) : x));
    const doc2 = clone(G('clienti', cid)); doc2.offerte = arr; applyLocalWrite('clienti', cid, doc2); await patch('clienti', cid, { offerte: arr });
  });
}
A.offNew = (d) => offForm(d.id, null);
A.offEdit = (d) => offForm(d.id, d.x);

/* ---------- ore lavorate ---------- */
const TIPI_ORE = [['L', 'Lavoro', 'green'], ['F', 'Ferie', 'blue'], ['P', 'Permesso', 'amber'], ['M', 'Malattia', 'red'], ['A', 'Altra assenza', 'grey']];

const meseLabel = (m) => { const p = m.split('-').map(Number); return MESI[p[1] - 1].toLowerCase() + ' ' + p[0]; };
const giorniDelMese = (m) => { const p = m.split('-').map(Number), n = new Date(p[0], p[1], 0).getDate(); return Array.from({ length: n }, (_, i) => m + '-' + String(i + 1).padStart(2, '0')); };

const tipoR = (r) => r.t || 'L';
const minRiga = (r) => { if (tipoR(r) === 'L') { const i = hm(r.i), u = hm(r.u); return i == null || u == null || u <= i ? 0 : Math.max(0, u - i - (Number(r.p) || 0)); } return Math.round((Number(r.o) || 0) * 60); };

const sogliaMin = () => Math.round((num((G('impostazioni', 'ore') || {}).soglia) || 8) * 60);
function oreTot(righe) {
  const t = { L: 0, F: 0, P: 0, M: 0, A: 0 }, per = {};
  righe.forEach((r) => { const k = tipoR(r); t[k] = (t[k] || 0) + minRiga(r); if (k === 'L') per[r.d] = (per[r.d] || 0) + minRiga(r); });

/* ---------- ore ordinarie, straordinari e tragitto (calcolo mensile) ----------

   Ore ordinarie = lavoro + tragitto al 70% fino alle ore da lavorare; il resto sono straordinari. */
const OREPAR = () => { const c = (S.admin ? G('impostazioni', 'ore') : (G('accessi', S.uid) || {}).oreCfg) || {}, ok = (v) => v !== '' && v != null && !isNaN(+v); return { oreGiorno: ok(c.oreGiorno) && +c.oreGiorno > 0 ? +c.oreGiorno : 8, tragitto: ok(c.tragitto) ? Math.min(100, Math.max(0, +c.tragitto)) : 85, festivi: String(c.festivi || ''), tolleranza: ok(c.tolleranza) && +c.tolleranza >= 0 ? +c.tolleranza : 0 }; };
function pasquaDi(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mese = Math.floor((h + l - 7 * m + 114) / 31), gg = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mese - 1, gg); }

    const m = addMese(meseOggi(), k);

const BASE_LISTE = {}; Object.keys(LISTE).forEach((k) => { BASE_LISTE[k] = LISTE[k].map((x) => x.slice()); });
const BASE_ITER = clone(DEFAULT_ITER);
const SIC_KEYS = [['ESECUTRICE', SIC_ESECUTRICE], ['AFFIDATARIA', SIC_AFFIDATARIA], ['SUBAPPALTATRICE', SIC_SUBAPPALTATRICE], ['DL', SIC_DL]];
const BASE_SIC = {}; SIC_KEYS.forEach(([k, obj]) => { BASE_SIC[k] = { nome: obj.nome, voci: obj.voci.slice() }; });
function applyConfig() {
  const l = CFG('liste');
  Object.keys(LISTE).forEach((k) => { const src = Array.isArray(l[k]) && l[k].length ? l[k] : BASE_LISTE[k]; LISTE[k].splice(0, LISTE[k].length, ...src.map((x) => x.slice())); });
  /* tipi aggiunti dopo: se l'elenco è stato personalizzato e salvato prima, mancherebbero */
  [['ab', 'PRIMI_CORSI'], ['docaz', 'ISCRIZIONE_CCIAA'], ['docaz', 'COORDINATE_BANCARIE'], ['docaz', 'NOMINE']].forEach(([k, c]) => {
    if (LISTE[k].some((x) => x[0] === c)) return;
    const b = BASE_LISTE[k].find((x) => x[0] === c); if (!b) return;
    const i = LISTE[k].findIndex((x) => x[0] === 'ALTRO'); LISTE[k].splice(i < 0 ? LISTE[k].length : i, 0, b.slice());
  });
  const it = CFG('iter').steps;
  DEFAULT_ITER.splice(0, DEFAULT_ITER.length, ...clone(Array.isArray(it) && it.length ? it : BASE_ITER));
  const sic = CFG('sicurezza');
  SIC_KEYS.forEach(([k, obj]) => {
    const ov = sic[k];
    obj.nome = (ov && ov.nome) || BASE_SIC[k].nome;
    obj.voci = (ov && Array.isArray(ov.voci) && ov.voci.length) ? ov.voci.slice() : BASE_SIC[k].voci.slice();
  });
}

}
const nrm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
/* riordino delle categorie del Documentale verso la struttura numerata (02/03/04 + Altri documenti).
   Tre livelli di regole: SUB_MAP (sottocategoria precisa → categoria nuova), ROOT_COLLAPSE (tutte le
   sottocategorie di una vecchia categoria finiscono in una sola), ROOT_MAP (le sottocategorie seguono
   la vecchia categoria nella nuova, mantenendo il proprio nome). Una categoria che l'amministratore ha
   creato e che non rientra in nessuna regola NON viene toccata. Le vecchie sottocategorie senza
   documenti vengono semplicemente eliminate; quelle con documenti vengono spostate. I file su Drive
   restano dove sono. */
const CAT_02 = '02 Amministrazione e contabilità', CAT_03 = '03 Contratti', CAT_04 = '04 Sistema qualità e sicurezza', CAT_ALTRI = 'Altri documenti';
const ROOT_MAP = { 'amministrazione e contabilita': CAT_02 };
const ROOT_COLLAPSE = {
  'sicurezza': [CAT_04, 'DVR, procedure e nomine sicurezza'],
  'certificazioni': [CAT_04, 'Certificazioni ISO e audit'],
  'sostenibilita': [CAT_04, 'Sostenibilità e rifiuti'],
  'bilancio': [CAT_02, 'Bilanci e dichiarazioni'],
  'rapporti banche': [CAT_02, 'Banche e finanziamenti'],
  'ddt': [CAT_ALTRI, 'Altro']
};
const SUB_MAP = {
  'amministrazione e contabilita/contratti e corrispondenza': [CAT_03, 'Altri contratti'],
  'amministrazione e contabilita/fatture e documenti contabili': [CAT_02, 'Prima nota e contabilità'],
  '02 amministrazione e contabilita/fatture generali': [CAT_02, 'Prima nota e contabilità'],
  'amministrazione e contabilita/adempimenti fiscali e tributari': [CAT_02, 'Bilanci e dichiarazioni'],
  'amministrazione e contabilita/prima nota': [CAT_02, 'Prima nota e contabilità']
};
const OLD_ROOTS = new Set(Object.keys(ROOT_MAP).concat(Object.keys(ROOT_COLLAPSE)));
function catTarget(rootNome, subNome) {
  const k = nrm(rootNome) + '/' + nrm(subNome);
  if (SUB_MAP[k]) return SUB_MAP[k];
  if (ROOT_COLLAPSE[nrm(rootNome)]) return ROOT_COLLAPSE[nrm(rootNome)];
  if (ROOT_MAP[nrm(rootNome)]) return [ROOT_MAP[nrm(rootNome)], subNome];
  return null;
}
function catAzioni() {
  const out = [];
  D('categorie').filter((c) => c.parentId).forEach((c) => {
    const r = G('categorie', c.parentId); if (!r) return;
    const t = catTarget(r.nome, c.nome); if (!t) return;
    if (nrm(t[0]) === nrm(r.nome) && nrm(t[1]) === nrm(c.nome)) return;
    out.push({ c: c, r: r, to: t, n: tuttiDoc().filter((x) => x.categoriaId === c.id).length });
  });
  return out;
}
async function catEnsure(rootName, subName) {
  let r = D('categorie').find((c) => !c.parentId && nrm(c.nome) === nrm(rootName));
  if (!r) { const id = 'cat-' + slug(rootName); await db.doc('categorie/' + id).set({ nome: rootName, parentId: null, ordine: D('categorie').filter((x) => !x.parentId).length + 1 }); r = { id: id, nome: rootName }; }
  let c = D('categorie').find((x) => x.parentId === r.id && nrm(x.nome) === nrm(subName));
  if (!c) { const id = 'cat-' + slug(rootName).slice(0, 8) + '-' + slug(subName); await db.doc('categorie/' + id).set({ nome: subName, parentId: r.id, ordine: 99 }); c = { id: id }; }
  return c.id;
}
async function eseguiRiordino(acts) {
  /* prudente: i documenti si rileggono al momento dell'esecuzione (non dal piano), si spostano,
     e la vecchia sottocategoria si elimina SOLO se dopo lo spostamento non ha più documenti. */
  let nd = 0, nc = 0;
  for (const x of acts) {
    const docs = tuttiDoc().filter((y) => y.categoriaId === x.c.id);
    if (docs.length) { const nid = await catEnsure(x.to[0], x.to[1]); for (const d of docs) { await patch(colDoc(d), d.id, { categoriaId: nid }); nd++; } }
    if (!tuttiDoc().some((y) => y.categoriaId === x.c.id)) { await db.doc('categorie/' + x.c.id).delete(); nc++; }
  }
  for (const r of D('categorie').filter((c) => !c.parentId)) {
    if (!OLD_ROOTS.has(nrm(r.nome))) continue;
    if (!D('categorie').some((c) => c.parentId === r.id)) { try { await db.doc('categorie/' + r.id).delete(); } catch (e) { /* ignora */ } }
  }
  return { nd: nd, nc: nc };
}
A.catMigra = async () => {

  const righe = acts.map((x) => x.r.nome + ' / ' + x.c.nome + ' → ' + x.to[0] + ' / ' + x.to[1] + (x.n ? ' (' + x.n + ' doc.)' : ' (vuota)')).join(' · ');
  if (!(await confirmBox('Riordino le categorie secondo la nuova struttura. Cambia così: ' + righe + '. I documenti vengono spostati nella nuova categoria; le vecchie categorie rimaste vuote vengono tolte. I file su Drive restano dove sono.', 'Riordina'))) return;
  try { const r = await eseguiRiordino(acts); toast('Categorie riordinate: ' + r.nd + (r.nd === 1 ? ' documento spostato' : ' documenti spostati') + ', ' + r.nc + (r.nc === 1 ? ' categoria unita.' : ' categorie unite.')); }
  catch (e) { toast('Riordino non completato: riprova.', 'err'); }
};

      } catch (e) { /* ignora: il controllo periodico rimette in pari */ }
    }).subscribe();
  }).catch(() => {});
}
function stopRealtime() { if (rtChan && SB) { try { SB.removeChannel(rtChan); } catch (e) { /* ignora */ } } rtChan = null; }
const lastLocalWriteAt = {};

/* ---------- apertura istantanea: ultima istantanea dei dati salvata nel browser ---------- */
/* Solo per mostrare subito qualcosa all'apertura, invece di uno schermo "in caricamento"
   vuoto finché whoami+listAll non rispondono: whoami e listAll partono comunque SEMPRE in
   parallelo (vedi boot()) e sovrascrivono questa anteprima non appena arrivano, quindi anche
   su un computer condiviso dove nel frattempo ha fatto accesso un'altra persona la vista
   corretta compare da sola in un istante, senza che questa cache sia mai l'unica fonte dei
   dati veri. La chiave è l'email di chi ha avuto l'accesso l'ultima volta su QUESTO browser
   (letta dal token Google salvato, senza bisogno di una chiamata di rete): così chi usa un
   altro account su un computer condiviso non vede nemmeno per un istante l'anteprima di
   qualcun altro. */
const BOOT_CACHE_PREFIX = 'gestionale-impianti:boot-cache:';
function decodeJwtEmail(token) {
  try {
    const payload = JSON.parse(decodeURIComponent(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map((c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
    return String(payload.email || '').toLowerCase();

}
function loadBootCache(email) {
  if (!email) return null;
  try { const raw = localStorage.getItem(BOOT_CACHE_PREFIX + email); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function saveBootCache(email, data) {
  if (!email) return;
  try { localStorage.setItem(BOOT_CACHE_PREFIX + email, JSON.stringify(data)); } catch (e) { /* storage pieno o non disponibile: pazienza, è solo una cache */ }
}

/* un'unica chiamata "listAll" per ogni ciclo di polling, smistata ai listener per collezione registrati da subscribe() */
/* intervallo di polling: più alto = meno chiamate al backend (la quota giornaliera di Apps
   Script non è infinita), a scapito di una sincronizzazione leggermente meno immediata */
const POLL_MS = 90000;      /* controllo di sicurezza: gli aggiornamenti normali arrivano in tempo reale */
const POLL_DOC_MS = 15000;
const collListeners = {};
let pollCache = null, pollTimer = null;
function snapFromDocs(docsMap) { return { docs: Object.keys(docsMap || {}).map((id) => ({ id: id, data: () => docsMap[id] })) }; }
/* notifica subito i listener di una collezione usando lo stato attuale di pollCache,
   usata sia dal polling periodico sia (per sentirsi reattivi) subito dopo ogni scrittura riuscita */
function dispatchCollection(col) {
  const reg = collListeners[col]; if (!reg) return;
  const key = JSON.stringify((pollCache && pollCache[col]) || {});
  if (reg.last !== key) { reg.last = key; reg.cbs.forEach((cb) => cb(snapFromDocs(pollCache[col]))); }
}
/* ogni scrittura locale (es. spostare un passaggio con le frecce) incrementa writeSeq: se un
   giro di polling già in corso finisce DOPO che l'utente ha appena salvato qualcosa, la sua
   risposta è ormai vecchia e non deve sovrascrivere quel salvataggio appena fatto (altrimenti
   il cambiamento sembra "funzionare male": si vede per un attimo e poi torna indietro). Lo
   stesso contatore, ma per singolo documento (writeSeqDoc), risolve lo stesso problema quando a
   essere "superata" non è una risposta di polling ma la risposta del backend a un salvataggio
   precedente sullo STESSO documento: spuntando due voci di una checklist una dopo l'altra in
   rapida successione, la conferma del server per la prima spunta può arrivare dopo che la
   seconda è già stata applicata in locale, e senza questo controllo la sovrascriverebbe
   facendola sembrare "non salvata" (stesso bug, dalla stessa causa, corretto altre volte per
   l'iter in passato — qui si risolve alla radice per qualunque documento). */
let writeSeq = 0;
const writeSeqDoc = {};
function applyLocalWrite(col, id, doc) {
  writeSeq++; lastLocalWriteAt[col + '/' + id] = Date.now();
  writeSeqDoc[col + '/' + id] = writeSeq;
  if (!pollCache) pollCache = {};
  if (!pollCache[col]) pollCache[col] = {};
  if (doc == null) delete pollCache[col][id]; else pollCache[col][id] = doc;
  dispatchCollection(col);
}
/* dopo il primo caricamento riuscito, un fallimento di listAll veniva ignorato in silenzio:
   i dati restavano quelli vecchi, senza alcun segnale che l'app avesse smesso di aggiornarsi —
   così un problema del backend sembrava un errore misterioso e intermittente invece di un
   disservizio in corso. Dopo qualche fallimento consecutivo (non uno isolato, per non allarmare
   per un singolo intoppo di rete) viene mostrato un avviso, tolto al primo aggiornamento che torna a funzionare. */
let pollFailStreak = 0;
async function pollOnce() {
  const seqBefore = writeSeq, genBefore = pollGen;
  try {
    const r = await api('listAll');
    if (writeSeq !== seqBefore || genBefore !== pollGen) return;
    pollCache = r.cols || {};
    Object.keys(collListeners).forEach(dispatchCollection);
    if (pollFailStreak > 0 || S.syncTrouble) { pollFailStreak = 0; S.syncTrouble = false; queueRender(); }
  } catch (e) {
    /* un rifiuto vero (non un problema di rete/risposta momentaneo) durante il polling normale
       vuol dire quasi sempre token scaduto: senza reagire qui, l'app smette silenziosamente di
       aggiornarsi finché non si ricarica la pagina, ed è lì che si scopre di essere stati
       disconnessi — meglio tentare subito un rinnovo silenzioso, prima che l'utente se ne accorga */
    if (!e.transient) maybeRefreshToken(true);
    pollFailStreak++;
    if (pollFailStreak >= 3 && !S.syncTrouble) { S.syncTrouble = true; queueRender(); }
    Object.keys(collListeners).forEach((col) => {
      const reg = collListeners[col];
      if (reg.last == null) { reg.last = '{}'; reg.errcbs.forEach((ecb) => ecb(e)); }
    });
  }
}
/* Ciclo che si riavvia da solo SOLO dopo che la chiamata precedente è finita, invece di un
   setInterval a orario fisso: se il backend è lento e una listAll impiega più di POLL_MS,
   un timer fisso avrebbe accumulato richieste una sopra l'altra, intasando il backend. */
let pollRunning = false;
let skipFirstPoll = false;
/* incrementato da stopPoll(): un giro di polling o un ciclo ancora in corso al momento del logout
   si accorge di essere di una sessione precedente e non scrive più nulla né riparte (altrimenti,
   al login successivo, ne girerebbero due insieme e la vecchia risposta rimetterebbe in cache
   i dati dell'account di prima). */
let pollGen = 0;
function ensurePoll() {
  if (pollTimer) return;
  pollTimer = true;
  const gen = pollGen;
  (async function loop() {
    while (pollTimer && gen === pollGen) {
      /* con la scheda/app in background non si interroga il backend: su telefono può restare
         aperta per ore senza che nessuno la guardi, e continuare a interrogarla consuma inutilmente
         la quota giornaliera di Apps Script (causa più probabile delle disconnessioni casuali) */
      if (skipFirstPoll) { skipFirstPoll = false; }
      else if (document.hidden) { /* salta questo giro */ }
      else {
        pollRunning = true;
        await pollOnce();
        if (gen === pollGen) pollRunning = false;
      }
      if (!pollTimer || gen !== pollGen) break;
      await new Promise((res) => setTimeout(res, POLL_MS));
    }
  })();
}
function stopPoll() { stopRealtime(); pollGen++; pollTimer = null; pollRunning = false; skipFirstPoll = false; Object.keys(collListeners).forEach((k) => delete collListeners[k]); pollCache = null; }
/* tornando visibile, aggiorna subito invece di aspettare fino a POLL_MS; e controlla anche se il
   token va rinnovato — su telefono, dopo che l'app è stata in background a lungo, il rinnovo
   periodico può non essere scattato in tempo (i timer vengono messi in pausa in background) */
if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (pollTimer && !pollRunning) pollOnce();
      maybeRefreshToken();
    }
  });
}

db = {
  collection: (col) => ({
    doc: () => ({ id: uid() }),
    onSnapshot: (cb, errCb) => {
      if (!collListeners[col]) collListeners[col] = { cbs: [], errcbs: [], last: null };
      collListeners[col].cbs.push(cb);
      if (errCb) collListeners[col].errcbs.push(errCb);
      ensurePoll();
      if (pollCache && pollCache[col]) cb(snapFromDocs(pollCache[col]));
      return () => { if (collListeners[col]) collListeners[col].cbs = collListeners[col].cbs.filter((x) => x !== cb); };
    }
  }),
  doc: (path) => {
    const parts = path.split('/');
    const col = parts[0], id = parts.length >= 4 ? parts[1] + '::' + parts[3] : parts[1];
    return {
      get: async () => { const r = await api('get', { col: col, id: id }); return { exists: !!r.found, data: () => r.doc }; },
      /* seq catturato PRIMA della chiamata di rete: include già l'eventuale scrittura
         ottimistica in locale appena fatta da chi ha chiamato questa funzione (così si parte
         già allineati), e se nel frattempo arriva una scrittura locale più recente sullo STESSO
         documento (es. un secondo click mentre il primo salvataggio è ancora in corso), la
         risposta di questa chiamata è ormai superata e non va applicata: altrimenti
         sovrascriverebbe silenziosamente il cambiamento più recente, facendolo sembrare "non
         salvato". */
      set: async (obj) => { const seq = writeSeqDoc[col + '/' + id]; await api('set', { col: col, id: id, data: obj }); if (writeSeqDoc[col + '/' + id] === seq) applyLocalWrite(col, id, obj); },
      update: async (part) => { const seq = writeSeqDoc[col + '/' + id]; const r = await api('update', { col: col, id: id, data: part }); if (writeSeqDoc[col + '/' + id] === seq) applyLocalWrite(col, id, r.doc); },
      delete: async () => { const seq = writeSeqDoc[col + '/' + id]; await api('delete', { col: col, id: id }); if (writeSeqDoc[col + '/' + id] === seq) applyLocalWrite(col, id, null); },
      onSnapshot: (cb, errCb) => {
        let stopped = false, last = null;
        (async function loop() {
          while (!stopped) {
            /* con la scheda/app in background non si interroga il backend, esattamente come il
               polling delle collezioni qui sopra: su telefono l'app può restare aperta per ore
               senza che nessuno la guardi, e un "get" ogni 15 secondi per ciascun utente consuma
               inutilmente la quota giornaliera di Apps Script (causa più probabile delle
               disconnessioni casuali). Tornando visibile, il giro successivo rilegge subito. */
            if (!(typeof document !== 'undefined' && document.hidden)) {
              try {
                const r = await api('get', { col: col, id: id });
                const key = JSON.stringify(r.doc || null);
                if (key !== last) { last = key; cb({ exists: !!r.found, data: () => r.doc }); }
              } catch (e) { if (errCb) errCb(e); }
            }
            await new Promise((res) => setTimeout(res, POLL_DOC_MS));
          }
        })();
        return () => { stopped = true; };
      }
    };
  }
};

/* ---------- caricamento diretto su Google Drive (più veloce del passaggio da Apps Script) ---------- */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_TOKEN_KEY = 'gestionale-impianti:drive-token';
/* deve essere IDENTICO (trattino compreso) al nome creato da setup() in Code.gs: un trattino
   diverso (es. "-" invece di "—") fa sì che Google Drive lo consideri un nome diverso, e il
   caricamento diretto dal browser finiva così per crearsi una SECONDA cartella invece di usare
   quella già impostata lato Apps Script (bug corretto il 2026-10-01: chi ha già due cartelle
   "Allegati" può unirle a mano, spostando il contenuto di quella in più dentro l'altra). */
const DRIVE_FOLDER_NAME = 'Gestionale Impianti — Allegati';
let driveTokenClient = null, driveTokenMem = null;

function loadSavedDriveToken() {
  try {
    const raw = localStorage.getItem(DRIVE_TOKEN_KEY); if (!raw) return null;
    const t = JSON.parse(raw);
    if (!t.accessToken || Date.now() >= t.expiresAt) return null;
    return t.accessToken;
  } catch (e) { return null; }
}
/* la durata del token è quella che Google restituisce davvero (resp.expires_in, in secondi,
   di solito un'ora) invece di un'ora fissa indovinata: un valore fisso più lungo di quello
   vero avrebbe fatto considerare "ancora valido" un token già scaduto da Google, con
   conseguente errore e nuova richiesta interattiva evitabile. Tolti 60 secondi di margine
   per non rischiare di usarlo proprio sul filo della scadenza. */
function saveDriveToken(accessToken, expiresInSec) {
  driveTokenMem = accessToken;
  const ttlMs = (Number(expiresInSec) > 0 ? Number(expiresInSec) * 1000 : 50 * 60 * 1000) - 60 * 1000;
  try { localStorage.setItem(DRIVE_TOKEN_KEY, JSON.stringify({ accessToken: accessToken, expiresAt: Date.now() + Math.max(ttlMs, 60 * 1000) })); } catch (e) { /* ignora */ }
}
function clearSavedDriveToken() {
  driveTokenMem = null;
  try { localStorage.removeItem(DRIVE_TOKEN_KEY); } catch (e) { /* ignora */ }
}
/* richiesta di token già in corso: se arriva un'altra richiesta nel frattempo (es. due campi
   "Sfoglia Drive" cliccati quasi insieme) si mette in coda dietro quella già partita invece di
   sovrascriverne il callback, altrimenti la prima richiesta non si sblocca mai più. */
let driveTokenRequest = null;
/* interactive=false: prova a ottenere un token senza mostrare nulla all'utente (silenzioso,
   usa il consenso già dato in precedenza). interactive=true: lo chiede comunque a Google, ma
   SENZA forzare la schermata di consenso completa (prompt vuoto, non 'consent'): se l'utente
   ha già autorizzato l'app in questo browser, Google restituisce un nuovo token senza mostrare
   nulla; la schermata compare solo se serve davvero (prima volta, o consenso revocato). Prima
   veniva forzata sempre, quindi ogni ora, su ogni dispositivo, l'app chiedeva di nuovo
   l'autorizzazione anche quando non ce n'era bisogno. */
function getDriveToken(interactive) {
  const cached = driveTokenMem || loadSavedDriveToken();
  if (cached && !interactive) return Promise.resolve(cached);
  if (!window.google || !google.accounts || !google.accounts.oauth2 || !CONFIG.CLIENT_ID) return Promise.resolve(null);
  if (driveTokenRequest) return driveTokenRequest;
  if (!driveTokenClient) {
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: () => {} // sovrascritto ad ogni richiesta, vedi sotto
    });
  }
  driveTokenRequest = new Promise((resolve) => {
    driveTokenClient.callback = (resp) => {
      driveTokenRequest = null;
      if (resp && resp.access_token) { saveDriveToken(resp.access_token, resp.expires_in); resolve(resp.access_token); }
      else resolve(null);
    };
    driveTokenClient.error_callback = () => { driveTokenRequest = null; resolve(null); };
    try { driveTokenClient.requestAccessToken({ prompt: '' }); }
    catch (e) { driveTokenRequest = null; resolve(null); }
  });
  return driveTokenRequest;
}
/* Se c'è già un token salvato (valido) lo riusa all'istante, senza nessuna chiamata di rete.
   Altrimenti richiede subito l'autorizzazione con popup (senza passare prima da un tentativo
   "silenzioso"): un tentativo silenzioso fallito, prima di quello con popup, fa perdere al
   browser il collegamento con il click dell'utente e il popup successivo viene bloccato. */
async function acquireDriveToken() {
  const cached = driveTokenMem || loadSavedDriveToken();
  if (cached) return cached;
  return getDriveToken(true);
}
async function driveFetch(token, url, init) {
  const res = await fetch(url, Object.assign({}, init, { headers: Object.assign({ Authorization: 'Bearer ' + token }, (init && init.headers) || {}) }));
  if (!res.ok) { const err = new Error('drive ' + res.status); err.status = res.status; throw err; }
  return res;
}
/* una sola risoluzione della cartella radice per tutta la sessione, condivisa da QUALUNQUE
   chiamata (non solo quelle con lo stesso percorso): senza, due caricamenti partiti quasi
   insieme — due schede aperte, due salvataggi ravvicinati — potevano eseguire ciascuno la
   propria ricerca "esiste già?" prima che l'altro avesse finito di crearla, e trovarsela
   entrambi assente: risultato, due cartelle "Allegati" diverse create nello stesso istante
   (bug reale, successo più volte). */
let driveRootFolderPromise = null;
async function driveEnsureFolder(token) {
  if (driveRootFolderPromise) {
    try { return await driveRootFolderPromise; } catch (e) { driveRootFolderPromise = null; }
  }
  driveRootFolderPromise = (async () => {
    /* l'id vero, fisso, della cartella — lo stesso che usa anche il caricamento di riserva via
       Apps Script — se il backend lo conosce (whoami lo restituisce): così la cartella si trova
       sempre per id, non cercandola per nome ogni volta, eliminando la corsa alla radice. La
       ricerca per nome resta solo come riserva, per quando questo non è ancora disponibile. */
    try { const fid = await scriptFolderId(); if (fid) return fid; } catch (e) { /* si passa alla ricerca per nome */ }
    const q = "name='" + DRIVE_FOLDER_NAME.replace(/'/g, "\\'") + "' and mimeType='application/vnd.google-apps.folder' and trashed=false";
    const res = await driveFetch(token, 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id)&spaces=drive');
    const data = await res.json();
    if (data.files && data.files[0]) return data.files[0].id;
    const created = await driveFetch(token, 'https://www.googleapis.com/drive/v3/files?fields=id', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
    });
    const c = await created.json();
    return c.id;
  })();
  try { return await driveRootFolderPromise; } catch (e) { driveRootFolderPromise = null; throw e; }
}
/* risolve (creando se serve) la cartella annidata dentro "Gestionale Impianti - Allegati" che
   corrisponde a pagina/commessa/sezione (es. ['Commesse', 'ABC123 · Mario Rossi', 'Sicurezza']):
   così i documenti non finiscono più tutti mescolati in un'unica cartella piatta. Le cartelle
   già risolte in questa sessione restano in cache, per non rifare le stesse chiamate ad ogni
   caricamento (e per non lasciare una cache "rotta" se una chiamata fallisce, l'entry viene
   tolta e il prossimo caricamento riprova).
   La risoluzione vera e propria passa SEMPRE dal backend (azione "resolveFolder"), che la fa
   dentro lo stesso lucchetto dei salvataggi dati: prima ogni sottocartella veniva cercata e
   creata direttamente da qui, senza alcuna protezione — due caricamenti quasi contemporanei
   nella stessa sottocartella non ancora creata (due schede, due persone, o il tentativo
   diretto e quello di riserva via Apps Script in corsa fra loro) potevano trovarla entrambi
   assente e crearla due volte. Costa un giro di rete in più alla prima volta che si usa un
   percorso (poi resta in cache per il resto della sessione), ma elimina la corsa alla radice.
   Il parametro "token" (il token OAuth di Drive) qui non serve più: chi autorizza a creare la
   cartella è l'account Google con cui si è fatto l'accesso al gestionale (l'idToken usato da
   api()), non quello di Drive — resta nella firma solo per il caso senza percorso qui sotto,
   che risolve solo la cartella radice e quello sì lo usa. */
const driveFolderCache = new Map();
async function driveEnsureFolderPath(token, segments) {
  const clean = (segments || []).map((s) => String(s || '').trim().slice(0, 100)).filter(Boolean).slice(0, 6);
  if (!clean.length) return driveEnsureFolder(token);
  const cacheKey = clean.join('/');
  if (driveFolderCache.has(cacheKey)) {
    try { return await driveFolderCache.get(cacheKey); } catch (e) { driveFolderCache.delete(cacheKey); }
  }
  const p = api('resolveFolder', { folderPath: clean }).then((r) => r.folderId);
  driveFolderCache.set(cacheKey, p);
  try { return await p; } catch (e) { driveFolderCache.delete(cacheKey); throw e; }
}
async function driveUploadDirect(token, folderId, file) {
  const boundary = 'gi-' + uid();
  const metadata = { name: file.name, parents: [folderId] };
  const head = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n--' + boundary + '\r\nContent-Type: ' + (file.type || 'application/octet-stream') + '\r\n\r\n';
  const tail = '\r\n--' + boundary + '--';
  const body = new Blob([head, file, tail]);
  const res = await driveFetch(token, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body
  });
  return res.json();
}
async function driveSetSharing(token, fileId) {
  await driveFetch(token, 'https://www.googleapis.com/drive/v3/files/' + fileId + '/permissions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' })
  });
}

/* ---------- selettore di file Google Drive (per collegare documenti già esistenti) ---------- */
let pickerLoadPromise = null;
function loadPickerApi() {
  if (pickerLoadPromise) return pickerLoadPromise;
  pickerLoadPromise = new Promise((resolve, reject) => {
    if (window.gapi && window.gapi.load) { gapi.load('picker', { callback: () => resolve() }); return; }
    const s = document.createElement('script');
    s.src = 'https://apis.google.com/js/api.js'; s.async = true; s.defer = true;
    s.onload = () => { gapi.load('picker', { callback: () => resolve() }); };
    s.onerror = () => reject(new Error('Impossibile caricare il selettore di Google Drive.'));
    document.head.appendChild(s);
  });
  return pickerLoadPromise;
}
/* quando la miniatura di una foto (fotoCard) non si carica — es. permessi non condivisibili su
   un Drive condiviso — mostra comunque qualcosa al posto di uno spazio vuoto e invisibile: la
   foto resta comunque apribile dal link intorno. */

  d.textContent = 'Apri su Drive';

/* Scelta di un file dal computer (input nativo, accanto a "Sfoglia Drive"): svuota l'eventuale

   subito, come per "Sfoglia Drive", cosa succederà al salvataggio: qui viene davvero caricata

}
/* Pulsante "Sfoglia Drive": NON passa dal dispatcher generico dell'app (quello con

/* caricamento via Apps Script: più lento (passa dal backend) ma sempre disponibile,
   usato quando l'accesso diretto a Drive non è (ancora, o più) autorizzato */
function uploadViaAppsScript(file, folderPath) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = String(reader.result).split(',')[1] || '';
        const r = await api('upload', { filename: file.name, mimeType: file.type || 'application/octet-stream', base64: base64, folderPath: folderPath || [] });
        resolve({ id: r.id, name: file.name, url: r.url || '' });
      } catch (e) { reject(e); }
    };
    reader.onerror = () => reject(new Error('Lettura del file non riuscita.'));
    reader.readAsDataURL(file);
  });
}

function subscribe(col) {

    const m = {};
    snap.docs.forEach((d) => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); });
    S.data[col] = m; S.loaded[col] = true; if (col === 'impostazioni') applyConfig(); queueRender();
    if (['commesse', 'commesseElenco', 'clienti', 'assegnazioni', 'assegnazioniG', 'squadre', 'accessi', 'impostazioni', 'dipendenti'].includes(col)) maybeSync();
    if (col === 'accessi') { resolveProf(); if (S.route === 'ore' && !S.oreLoading) loadAllOre(S.mese || meseOggi(), true); }
    if (col === 'categorie' || col === 'impostazioni') seedCategorieDefault();

  }, (err) => { console.warn('db', col, err); S.data[col] = S.data[col] || {}; S.loaded[col] = true; queueRender(); });
}

async function seedCategorieDefault() {
  if (!S.admin || !db || categorieSeeding || categorieSeedTentata || !S.loaded.categorie || !S.loaded.impostazioni) return;
  const fatte = CFG('categorieSeed').fatte || [];
  const mancano = DEFAULT_CATEGORIE.filter((r) => !fatte.includes('cat-' + slug(r.nome)));
  if (!mancano.length) return;
  /* tentato una volta sola per sessione (anche se fallisce): questa funzione viene richiamata
     ad ogni giro di polling di "categorie"/"impostazioni" (ogni 30 secondi) finché il flag che
     segna "fatto" non viene salvato — se quel salvataggio non andasse a buon fine anche solo una
     volta, senza questo limite si ripartirebbe da capo ad ogni giro, con scritture continue
     verso lo stesso lucchetto condiviso del backend usato da ogni salvataggio dell'app
     (bug reale, capitato con la migrazione delle scadenze mezzi: vedi migraScadenzeMezziDaiCampi
     più sotto). Il prossimo tentativo si fa solo al prossimo caricamento della pagina. */
  categorieSeeding = true; categorieSeedTentata = true;
  try {
    let ord = D('categorie').filter((x) => !x.parentId).length + 1;
    const nuoviCodici = [];
    for (const r of mancano) {
      const rid = 'cat-' + slug(r.nome);
      nuoviCodici.push(rid);
      if (!G('categorie', rid)) {
        await db.doc('categorie/' + rid).set({ nome: r.nome, parentId: null, ordine: ord++ });
        let ordC = 1;
        for (const f of r.figli) { const cid = 'cat-' + slug(f); if (!G('categorie', cid)) await db.doc('categorie/' + cid).set({ nome: f, parentId: rid, ordine: ordC }); ordC++; }
      }
    }
    await db.doc('impostazioni/categorieSeed').set({ fatte: fatte.concat(nuoviCodici) });
    toast('Documentale: aggiunte le categorie di base ' + mancano.map((r) => r.nome).join(', ') + '. Puoi già caricare i documenti (le puoi rinominare o cambiare da Impostazioni → Categorie documenti).');
  } catch (e) { /* se qualcosa fallisce a metà, riprova al prossimo caricamento della pagina */ }
  finally { categorieSeeding = false; }
}

      nuoviCodici.push(rid);
      if (!G('tipiLavoro', rid)) {
        await db.doc('tipiLavoro/' + rid).set({ nome: r.nome, codice: '', abilitazioniRichieste: [], docImpresaRichiesti: [], fasiNuovo: r.fasiNuovo, fasiRifacimento: r.fasiRifacimento });
      }
    }
    if (obsoleti.length) { tipiLavoroObsoletiTentati = true; for (const rid of obsoleti) { try { await db.doc('tipiLavoro/' + rid).delete(); } catch (e) { /* ignora */ } } }
    if (nuoviCodici.length) await db.doc('impostazioni/tipiLavoroSeed').set({ fatte: fatte.concat(nuoviCodici) });
    if (mancano.length) toast('Aggiunte le tipologie di lavoro di base: nella scheda di ogni commessa, sezione Cantiere, si sceglie nuova installazione o rifacimento per caricare la checklist pronta.');
  } catch (e) { /* se qualcosa fallisce a metà, riprova al prossimo caricamento della pagina */ }
  finally { tipiLavoroSeeding = false; }
}
/* una tantum: le scadenze di revisione/bollo dei mezzi non si leggono più dai due campi scritti
   a mano sulla scheda del mezzo (revisioneScadenza/bolloScadenza) ma dall'ultimo controllo di
   quel tipo caricato in "Controlli" (vedi scadenzaControllo). Per non perdere le scadenze che
   erano già state scritte a mano prima di questo cambiamento, la prima volta si crea per ognuna
   un controllo corrispondente (senza file allegato: solo la data di scadenza, per tenerla
   visibile) — fatto una volta sola per mezzo, segnato in impostazioni → mezziScadenzeMigrate. */
let mezziScadenzeMigrando = false, mezziScadenzeTentata = false;
async function migraScadenzeMezziDaiCampi() {
  if (!S.admin || !db || mezziScadenzeMigrando || mezziScadenzeTentata || !S.loaded.mezzi || !S.loaded.impostazioni) return;
  if (CFG('mezziScadenzeMigrate').fatto) return;
  const daMigrare = D('mezzi').filter((m) => (m.revisioneScadenza && !scadenzaControllo(m, 'REVISIONE')) || (m.bolloScadenza && !scadenzaControllo(m, 'BOLLO')));
  /* tentata una volta sola per sessione (anche se fallisce): questa funzione viene richiamata
     ad ogni giro di polling di "mezzi"/"impostazioni" (ogni 30 secondi), e se il salvataggio
     finale del flag "fatto" non andasse a buon fine per un intoppo del backend, ritentare
     l'intera migrazione ad ogni giro aggiungerebbe scritture continue proprio mentre il backend
     è già in difficoltà, rallentando anche i salvataggi degli altri (stesso motivo per cui
     seedTipiLavoroDefault limita così i suoi tentativi di pulizia). */
  mezziScadenzeMigrando = true; mezziScadenzeTentata = true;
  try {
    for (const m of daMigrare) {
      const controlli = clone(m.controlli || []);
      if (m.revisioneScadenza && !scadenzaControllo(m, 'REVISIONE')) controlli.push({ id: uid(), tipo: 'REVISIONE', data: '', esito: 'CONFORME', prossimaScadenza: m.revisioneScadenza, eseguitoDa: '', note: 'Migrato automaticamente dal vecchio campo "Prossima revisione".' });
      if (m.bolloScadenza && !scadenzaControllo(m, 'BOLLO')) controlli.push({ id: uid(), tipo: 'BOLLO', data: '', esito: 'CONFORME', prossimaScadenza: m.bolloScadenza, eseguitoDa: '', note: 'Migrato automaticamente dal vecchio campo "Scadenza bollo".' });
      await db.doc('mezzi/' + m.id).update({ controlli });
    }
    await db.doc('impostazioni/mezziScadenzeMigrate').set({ fatto: true });
    if (daMigrare.length) toast('Scadenze di revisione/bollo spostate nei controlli dei mezzi: ora si aggiornano caricando un nuovo controllo, invece che modificando la scheda del mezzo.');
  } catch (e) { /* se qualcosa fallisce a metà, riprova al prossimo caricamento della pagina */ }
  finally { mezziScadenzeMigrando = false; }
}
function subscribeUser() {
  /* prima qui c'era un secondo ciclo di polling indipendente (db.doc(...).onSnapshot, con un
     suo giro ogni 30 secondi tutto suo) solo per il proprio documento "accessi" — ma quel
     documento arriva già, per i non amministratori, dentro la stessa risposta di listAll usata
     da "commesseElenco" (vedi apiListAll in Code.gs). Era quindi traffico doppio verso il
     backend per ogni dipendente collegato, per gli stessi dati. Usando lo stesso meccanismo di
     subscribe() degli altri dati si condivide lo stesso giro di polling, e in più si aggancia
     alla pulizia già esistente in stopPoll()/logout (il vecchio ciclo indipendente non veniva
     mai fermato: ad ogni logout+login nella stessa scheda del browser se ne accumulava uno
     nuovo, che restava attivo per sempre). */
  if (S.uid) subscribe('accessi'); else { S.data.accessi = {}; S.loaded.accessi = true; }
  subscribe('commesseElenco');
}
routeHooks.ore = () => { if (!S.mese) S.mese = meseOggi(); loadAllOre(S.mese); };
routeHooks.mieore = () => { if (!S.mese) S.mese = meseOggi(); if (S.myOre.mese !== S.mese) watchMio(S.mese); ensureView(); };
async function boot() {
  render();
  if (!ID_TOKEN) { showLogin(); return; }
  /* la verifica dell'account e il primo caricamento dati partono insieme, invece che uno
     dopo l'altro: finché non sappiamo se l'utente è amministratore non sappiamo quali
     collezioni servono, ma il server lo capisce comunque dal token, quindi non serve
     aspettare la risposta di whoami prima di chiedere anche i dati. */
  const prefetch = api('listAll').catch(() => null);
  /* anteprima istantanea dall'ultima apertura riuscita su questo browser (vedi la nota sopra
     loadBootCache): mostra subito qualcosa invece di uno schermo "in caricamento" vuoto, ma
     non è mai l'unica fonte dei dati — whoami+listAll proseguono comunque sotto e la
     sovrascrivono non appena rispondono. */
  const cached = loadBootCache(decodeJwtEmail(ID_TOKEN));
  if (cached && cached.cols) {
    S.admin = !!cached.admin; S.me = cached.me || ''; S.uid = cached.uid || null;
    if (!S.admin) S.route = 'mieore';
    Object.keys(cached.cols).forEach((col) => {
      const src = cached.cols[col] || {}, m = {};
      Object.keys(src).forEach((id) => { m[id] = Object.assign({}, src[id], { id: id }); });
      S.data[col] = m; S.loaded[col] = true;
    });
    if (cached.cols.impostazioni) applyConfig();
    queueRender();
  }
  let w;
  try { w = await whoami(); } catch (e) { if (!e.transient) clearSavedToken(); ID_TOKEN = null; showLogin(e.transient ? 'Il server non risponde al momento. Riprova tra qualche istante.' : (e.message || 'Accesso non riuscito.')); return; }
  if (w.unauthorized) { S.unauthorized = true; S.pendingEmail = w.email; render(); return; }
  S.admin = w.role === 'admin'; S.me = w.name || ''; S.uid = w.email;
  lastRefreshOk = Date.now();
  S.mese = meseOggi();
  setTimeout(() => { S.late = true; queueRender(); }, 6000);
  const pref = await prefetch;
  if (pref && pref.ok) { pollCache = pref.cols || {}; skipFirstPoll = true; saveBootCache(w.email, { admin: S.admin, me: S.me, uid: w.email, cols: pollCache }); }
  startRealtime();
  if (S.admin) COLS.forEach(subscribe); else { S.route = 'mieore'; subscribeUser(); }
  if (S.uid) watchMio(S.mese);
  /* senza questa guardia (come già per __tokenRefreshTimer sotto), ogni volta che boot() viene
     rieseguito nella stessa scheda se ne aggiungerebbe un altro sopra i precedenti, sempre attivo */
  if (!window.__refreshTimer) window.__refreshTimer = setInterval(() => { if (S.admin && !FORM && !document.hidden) { if (S.route === 'ore') loadAllOre(S.mese || meseOggi(), true); else if (S.route === 'mieore') ensureView(); } }, 60000);
  /* il token Google dura circa un'ora: senza rinnovarlo, prima o poi ogni chiamata al backend
     verrebbe rifiutata e l'utente si ritroverebbe disconnesso a metà lavoro. Lo si rinnova da
     solo, in background, ben prima che scada — così una sessione aperta resta valida finché
     resta aperta, senza dover mai rifare l'accesso. */
  if (!window.__tokenRefreshTimer) window.__tokenRefreshTimer = setInterval(() => maybeRefreshToken(true), 20 * 60 * 1000);
  queueRender();
}
if (typeof window !== 'undefined' && !window.__TEST__) tryResume();
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    /* toglie il vecchio service worker (sw.js) delle prime versioni, che poteva tenere in memoria una copia vecchia dell'app */
    navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { const u = (r.active && r.active.scriptURL) || ''; if (/\/sw\.js$/.test(u)) r.unregister(); })).catch(() => {});
    if (window.caches) caches.keys().then((ks) => ks.filter((k) => /^gi-sb-/.test(k)).forEach((k) => caches.delete(k))).catch(() => {});
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
/* traccia in console gli errori che non passano da render() (es. dentro un gestore di click),
   così restano una prova consultabile invece di sparire senza lasciare indizi */
if (typeof window !== 'undefined') {
  window.addEventListener('error', (e) => { console.error('Errore non gestito:', e.error || e.message); });
  window.addEventListener('unhandledrejection', (e) => { console.error('Promise non gestita:', e.reason); });
}
